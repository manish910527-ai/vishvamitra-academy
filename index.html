<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vishvamitra + Tirole Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="style.css?v=1.1">
</head>
<body>

    <header class="app-header">
        <h1>Vishvamitra + Tirole</h1>
        <div id="userProfile" class="hidden">👤 <span id="displayStudentName"></span></div>
    </header>

    <section id="loginScreen" class="screen active">
        <div class="card" style="text-align: center;">
            <h2>Welcome to Mock Tests</h2>
            <p style="color: gray; margin-bottom: 15px;">Enter your name to start</p>
            <input type="text" id="studentName" placeholder="Your Full Name">
            <button onclick="loginStudent()" class="btn-primary">Start Learning</button>
        </div>
    </section>

    <section id="dashboardScreen" class="screen hidden">
        <div class="card">
            <h2>Available Tests</h2>
            <div id="testList" class="test-grid">
                <p>Loading tests from database...</p>
                </div>
        </div>
    </section>

    <section id="quizScreen" class="screen hidden">
        <div class="quiz-header">
            <span id="timer" style="color: #ef4444;">⏱ 00:00</span>
            <button onclick="submitQuiz()" class="btn-danger" style="margin: 0;">Submit Test</button>
        </div>
        
        <div class="question-container card">
            <h3 id="questionText" style="margin-bottom: 15px;">Question loading...</h3>
            <div id="questionImageContainer"></div>
            <div class="options" id="optionsContainer">
                </div>
        </div>

        <div class="palette-container card" style="margin-top: 15px;">
            <h4 style="margin-bottom: 10px; text-align: center;">Question Palette</h4>
            <div id="questionPalette" class="palette-grid"></div>
        </div>

        <div class="action-buttons">
            <button onclick="markForReview()" class="btn-warning">Mark for Review</button>
            <button onclick="nextQuestion()" class="btn-primary">Next Question</button>
        </div>
    </section>

    <section id="resultScreen" class="screen hidden">
        <div class="card" style="text-align: center;">
            <h2>Test Completed! 🎉</h2>
            <h3 style="margin: 20px 0; font-size: 2rem; color: var(--accent-color);">
                Score: <span id="finalScore">0</span> / <span id="totalMarks">0</span>
            </h3>
            <p style="margin-bottom: 15px;">Great effort! Please submit your marks to the academy record.</p>
            <button onclick="submitToGoogleForm()" class="btn-primary">Submit Marks to Academy</button>
            <button onclick="location.reload()" class="btn-warning" style="margin-top: 10px; background: #64748b;">Back to Home</button>
        </div>
        
        <div id="reviewBox" class="card hidden" style="margin-top: 20px;">
            <h3 style="margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;">Answer Key & Explanations</h3>
            <div id="reviewContent"></div>
        </div>
    </section>

    <script src="app.js?v=1.1"></script>
</body>
</html>
